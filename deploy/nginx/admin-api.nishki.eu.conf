# admin.nishki.eu + api.nishki.eu → one Payload process (host-based routing happens in apps/cms/src/proxy.ts).
# In Plesk: paste the location blocks into "Additional nginx directives" of each subdomain and disable "Proxy mode" to Apache.
upstream nishki_cms {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.nishki.eu api.nishki.eu;

  # ssl_certificate / ssl_certificate_key — managed by Plesk / certbot

  client_max_body_size 50m;   # photo uploads

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  location = /api/users/login {
    limit_req zone=nishki_login burst=5 nodelay;
    proxy_pass http://nishki_cms;
  }

  location / {
    proxy_pass http://nishki_cms;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  server_name admin.nishki.eu api.nishki.eu;
  return 301 https://$host$request_uri;
}
