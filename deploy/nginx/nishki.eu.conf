# Static site served from the VPS (alternative to Cloudflare Pages — see apps/web/public/_headers for that case).
server {
  listen 443 ssl;
  http2 on;
  server_name www.nishki.eu;
  return 301 https://nishki.eu$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name nishki.eu;

  root /var/www/nishki/current;   # symlink swapped by deploy/build-and-deploy.sh
  index index.html;
  disable_symlinks off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.nishki.eu; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.nishki.eu; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  }

  error_page 404 /404.html;

  # 301s for old URLs go here (Phase 7), e.g.:
  # location = /old-portfolio { return 301 /gallery/; }
}

server {
  listen 80;
  server_name nishki.eu www.nishki.eu;
  return 301 https://nishki.eu$request_uri;
}
